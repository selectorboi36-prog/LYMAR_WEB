<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LYMAR Study & Quiz Mode</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #07111f;
    color: #ffffff;
    min-height: 100vh;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 35px 0 60px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #00e5ff;
}

.subtitle {
    color: #9fb3c8;
    font-size: 16px;
    margin-top: 8px;
}

.card {
    background: #0d1b2a;
    border: 1px solid #1e3a52;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

h1,
h2,
h3 {
    margin-top: 0;
}

h2 {
    color: #00e5ff;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.control-group label {
    display: block;
    margin-bottom: 9px;
    color: #b9c9d8;
    font-weight: bold;
}

select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #31506b;
    background: #081522;
    color: white;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
}

.primary {
    background: #00e5ff;
    color: #031018;
}

.secondary {
    background: #183247;
    color: white;
    border: 1px solid #31506b;
}

.start-area {
    margin-top: 25px;
    text-align: center;
}

#quizArea {
    display: none;
}

.quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.progress {
    color: #8fa9bd;
}

.score {
    color: #00e5ff;
    font-weight: bold;
}

.question-number {
    color: #8fa9bd;
    margin-bottom: 10px;
}

.question {
    font-size: 24px;
    line-height: 1.45;
    margin-bottom: 25px;
}

.options {
    display: grid;
    gap: 13px;
}

.option {
    width: 100%;
    text-align: left;
    background: #102437;
    color: white;
    border: 1px solid #31506b;
    padding: 17px;
    border-radius: 12px;
}

.option:hover:not(:disabled) {
    background: #17344c;
    border-color: #00e5ff;
}

.option.correct {
    background: #123b2d;
    border-color: #35d08b;
}

.option.wrong {
    background: #452029;
    border-color: #ff5c70;
}

.option:disabled {
    cursor: default;
    transform: none;
}

.explanation {
    display: none;
    margin-top: 22px;
    padding: 18px;
    border-radius: 12px;
    background: #101f2d;
    border-left: 4px solid #00e5ff;
    line-height: 1.6;
}

.next-area {
    margin-top: 22px;
    text-align: right;
}

#resultArea {
    display: none;
    text-align: center;
}

.final-score {
    font-size: 52px;
    color: #00e5ff;
    font-weight: 900;
    margin: 20px 0;
}

.result-message {
    font-size: 20px;
    margin-bottom: 25px;
    color: #c9d7e4;
}

.home-link {
    display: inline-block;
    margin-top: 18px;
    color: #00e5ff;
    text-decoration: none;
}

.home-link:hover {
    text-decoration: underline;
}

.small-note {
    color: #8197aa;
    font-size: 13px;
    margin-top: 12px;
}

@media (max-width: 700px) {

    .controls {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 38px;
    }

    .question {
        font-size: 20px;
    }

    .card {
        padding: 20px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

                        Entrepreneurship
                    </option>
                    <option value="Psychology">
                        Psychology
                    </option>
                    <option value="Literature">
                        Literature
                    </option>

                        Geography

            </div>

        </div>

    </div>


    <!-- QUIZ -->

    <div class="card" id="quizArea">

        <div class="quiz-top">

            <div

                id="progressText"
            >
                Question 1 of 5
            </div>

            <div
                class="score"
                id="scoreText"
            >
                Score: 0
            </div>

        </div>


        <div
            class="question-number"
            id="questionNumber"
        >
            Question 1
        </div>


        <div
            class="question"
            id="questionText"
        >
        </div>


        <div
            class="options"
            id="optionsContainer"
        >
        </div>


        <div
            class="explanation"
            id="explanation"
        >
        </div>


        <div class="next-area">

            <button
                class="primary"
                id="nextButton"
                onclick="nextQuestion()"
                style="display:none;"
            >
                NEXT QUESTION →
            </button>

        </div>

    </div>


    <!-- FINAL RESULT -->

    <div class="card" id="resultArea">

        <h2>🎉 Quiz Complete!</h2>

        <div
            class="final-score"
            id="finalScore"
        >
            0%
        </div>

        <div
            class="result-message"
            id="resultMessage"
        >
        </div>

        <button
            class="primary"
            onclick="tryAgain()"
        >
            🔄 TRY AGAIN
        </button>

        <br>

        <a
            href="/"
            class="home-link"
        >
            ← Return to LYMAR
        </a>

    </div>

</div>

/* =========================
   QUIZ VARIABLES
   ========================= */

let currentQuestions = [];

let currentQuestionIndex = 0;

let score = 0;

let answered = false;


/* =========================
   START QUIZ
   ========================= */

function startQuiz() {

    const subject =
        document.getElementById("subject").value;

    const difficulty =
        document.getElementById("difficulty").value;

    currentQuestions =
        quizDatabase[subject][difficulty];

    currentQuestionIndex = 0;

    score = 0;

    answered = false;

    document.getElementById("setupArea").style.display =
        "none";

    document.getElementById("resultArea").style.display =
        "none";

    document.getElementById("quizArea").style.display =
        "block";

    document.getElementById("scoreText").textContent =
        "Score: 0";

    showQuestion();

}


/* =========================
   SHOW QUESTION
   ========================= */

function showQuestion() {

    answered = false;

    const question =
        currentQuestions[currentQuestionIndex];

    document.getElementById("progressText").textContent =
        "Question " +
        (currentQuestionIndex + 1) +
        " of " +
        currentQuestions.length;

    document.getElementById("questionNumber").textContent =
        "Question " +
        (currentQuestionIndex + 1);

    document.getElementById("questionText").textContent =
        question.question;

    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";

    question.options.forEach(
        function(optionText, index) {

            const button =
                document.createElement("button");

            button.className =
                "option";

            button.textContent =
                String.fromCharCode(65 + index) +
                ". " +
                optionText;

            button.onclick =
                function() {

                    checkAnswer(index);

                };

            optionsContainer.appendChild(button);

        }
    );

    document.getElementById("explanation").style.display =
        "none";

    document.getElementById("explanation").textContent =
        "";

    document.getElementById("nextButton").style.display =
        "none";

}


/* =========================
   CHECK ANSWER
   ========================= */

function checkAnswer(selectedIndex) {

    if (answered) {
        return;
    }

    answered = true;

    const question =
        currentQuestions[currentQuestionIndex];

    const optionButtons =
        document.querySelectorAll(".option");

    optionButtons.forEach(
        function(button, index) {

            button.disabled = true;

            if (index === question.answer) {

                button.classList.add("correct");

            }

        }
    );


    if (selectedIndex === question.answer) {

        score++;

        document.getElementById("scoreText").textContent =
            "Score: " + score;

    } else {

        optionButtons[selectedIndex]
            .classList.add("wrong");

    }


    const explanation =
        document.getElementById("explanation");

    if (selectedIndex === question.answer) {

        explanation.innerHTML =
            "<strong>Correct! ✓</strong><br><br>" +
            question.explanation;

    } else {

        explanation.innerHTML =
            "<strong>Not quite.</strong><br><br>" +
            "Correct answer: " +
            question.options[question.answer] +
            "<br><br>" +
            question.explanation;

    }

    explanation.style.display =
        "block";


    const nextButton =
        document.getElementById("nextButton");

    nextButton.style.display =
        "inline-block";

    if (
        currentQuestionIndex ===
        currentQuestions.length - 1
    ) {

        nextButton.textContent =
            "SEE FINAL RESULT →";

    } else {

        nextButton.textContent =
            "NEXT QUESTION →";

    }

}


/* =========================
   NEXT QUESTION
   ========================= */

function nextQuestion() {

    if (!answered) {
        return;
    }

    currentQuestionIndex++;

    if (
        currentQuestionIndex >=
        currentQuestions.length
    ) {

        showFinalResult();

        return;

    }

    showQuestion();

}


/* =========================
   FINAL RESULT
   ========================= */

function showFinalResult() {

    document.getElementById("quizArea").style.display =
        "none";

    document.getElementById("resultArea").style.display =
        "block";

    const percentage =
        Math.round(
            (score / currentQuestions.length) * 100
        );

    document.getElementById("finalScore").textContent =
        score +
        " / " +
        currentQuestions.length +
        " (" +
        percentage +
        "%)";


    let message;

    if (percentage === 100) {

        message =
            "Excellent work! You answered every question correctly.";

    }

    else if (percentage >= 80) {

        message =
            "Great work! You have a strong understanding of this topic.";

    }

    else if (percentage >= 60) {

        message =
            "Good effort! Review the explanations and keep practicing.";

    }

    else if (percentage >= 40) {

        message =
            "Keep learning! Review this topic and try the quiz again.";

    }

    else {

        message =
            "Keep practicing. Use the explanations to strengthen your understanding.";

    }

    document.getElementById("resultMessage").textContent =
        message;

}


/* =========================
   TRY AGAIN
   ========================= */

function tryAgain() {

    document.getElementById("resultArea").style.display =
        "none";

    document.getElementById("setupArea").style.display =
        "block";

}
